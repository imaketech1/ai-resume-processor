services:
  - type: web
    name: ai-resume-processor
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false  
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b